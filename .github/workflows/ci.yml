name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # Detector-backed integration tests are intentionally gated in default CI.
      # They require external tools and larger reference assets than this workflow installs.
      CIRCYTO_SKIP_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check repository file sizes
        run: python scripts/check_repository_file_sizes.py --base-ref origin/main --fail-scope added

      - name: Run test suite
        run: pytest -q .
