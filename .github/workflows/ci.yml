name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      # Detector-backed integration tests are intentionally gated in default CI.
      # They require external tools and larger reference assets than this workflow installs.
      CIRCYTO_SKIP_INTEGRATION: "1"
      # Typer forces ANSI styling under GITHUB_ACTIONS even in captured output.
      _TYPER_FORCE_DISABLE_TERMINAL: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -c "import anndata, mudata, scipy; print(anndata.__version__, mudata.__version__, scipy.__version__)"
          python -m pip check
          python -m pip freeze > dependencies.txt

      - name: Run test suite
        run: python -m pytest -q . --junitxml=test-results.xml

      - name: Verify importer, MuData and QC tests executed
        if: always()
        run: python .github/scripts/check_acceptance_junit.py test-results.xml

      - name: Build and exercise installed wheel outside checkout
        run: |
          python -m build
          python -m venv "$RUNNER_TEMP/wheel-env"
          built_wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install "${built_wheels[0]}[mudata]"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip check
          cp -r examples/native_ciri3 "$RUNNER_TEMP/native_ciri3"
          cp examples/validate_native_ciri3.py "$RUNNER_TEMP/validate_native_ciri3.py"
          cp .github/scripts/check_installed_distribution.py "$RUNNER_TEMP/check_installed_distribution.py"
          cd "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/wheel-env/bin:$PATH"
          python -c 'import circyto; print(circyto.__file__); assert "site-packages" in circyto.__file__'
          python check_installed_distribution.py
          circyto import-circ --help
          circyto report --help
          python validate_native_ciri3.py --fixtures native_ciri3 --out native-acceptance

      - name: Retain validation records (no detector binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python }}
          path: |
            test-results.xml
            dependencies.txt
            ${{ runner.temp }}/native-acceptance/acceptance.json
