# Environment installation, NOT a native conda package.
# After creation install the exact reviewed wheel with pip --no-deps.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - typer >=0.9,<1
  - rich >=13
  - pandas >=2
  - numpy >=1.24
  - scipy >=1.10
  - anndata >=0.10
  - mudata >=0.3
