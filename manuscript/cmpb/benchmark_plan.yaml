    case: duplicate cell IDs in cells, RNA or native mapping
    valid: false
  - id: R04
    case: literal 001 and NA IDs; exact string-preserving mapping
    valid: true
  - id: R05
    case: failed/unknown/unprocessed/skipped rows; alter only status, retain all support
    valid: true
  - id: R06
    case: failed rows with positive partial support
    valid: true
  - id: R07
    case: mixed declared build/coordinate/support units
    valid: false
  - id: R08
    case: duplicate cell/candidate records or duplicate native candidate rows
    valid: false
  - id: R09
    case: explicit sparse zero entries; numerical values preserved, zero removed from nonzero statistics
    valid: true
  - id: R10
    case: all statuses unknown/no completed denominator
    valid: true
  - id: R11
    case: completed-zero lacking a mapped native result/source zero column
    valid: false
  native_label: H5MU-derived calls use --calls or --matrix-dir; never relabel as authentic native evidence.
    Native-only perturbations use clearly synthetic or separately perturbed genuine native copies.
  no_fraction_cross_product_for: Deterministic invalid-schema/duplicate/literal-ID/no-denominator controls
    use one fixed case plus clean control; fractions/seeds apply only meaningful stochastic scenarios
  completed_cohort_prevalence: sum_i[e_i * I(x_ij > 0)] / sum_i[e_i]; undefined if sum_i[e_i]==0
  oracle: Independent per-record sums for exactly the same completed cohort and declared assay; no comparison
    to full cohort as if dropout bias were corrected
  endpoints:
  - cell-assignment errors
  - count and annotation preservation
  - invalid-input detection
  - false rejection on valid input
  - missing-state preservation
  - absolute completed-cohort prevalence error
  - HTML/JSON/TSV/matrix disagreement
  retention: All configurations, warnings, failures and seed-level rows; seeds are simulation repeats, not
    biological replicates
  resource_proposal:
    cores: 2
    ram_gib: 4
    disk_gib: 10
    wall_hours: 2
