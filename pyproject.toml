[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circyto"
version = "0.10.0"
description = "A Python CLI toolkit for single-cell circRNA detection, detector orchestration, matrix generation, and multimodal export."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "James Liu" }]
license = { text = "MIT" }

dependencies = [
  "typer>=0.9,<1.0",
  "rich>=13.0",
  "tqdm>=4.66",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "anndata>=0.10",
]

[project.optional-dependencies]
loom = ["loompy>=3.0"]
mudata = ["mudata>=0.3"]
scanpy = ["mudata>=0.3", "scanpy>=1.10"]
dev = ["pytest>=8", "mudata>=0.3"]

[project.scripts]
circyto = "circyto.cli.circyto:app"

[project.urls]
Homepage = "https://github.com/liuifrec/circyto"
Issues   = "https://github.com/liuifrec/circyto/issues"

[tool.setuptools.packages.find]
include = ["circyto", "circyto.*"]
exclude = ["tests*", "fastq*", "ref*", "assets*", "work_*", "data*", ".github*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
circyto = [
  "**/*.txt",
  "**/*.sh",
  "resources/**/*",
  "resources/**/*.fa",
  "resources/**/*.gtf",
  "resources/**/*.fastq",
  "resources/**/*.tsv",
]

[tool.pytest.ini_options]
markers = [
  "slow: slow tests that may take longer to run",
  "integration: integration tests that require external tools (bowtie2, find-circ3, etc.)"
]

# External runtime requirements (not managed by pip).
# These are system or third-party tool dependencies and must be installed
# separately via conda, apt, brew, or another system package manager.
[tool.circyto.external]
ciri3 = [
  "java",
  "CIRI3 jar (tools/CIRI3 or CIRCYTO_CIRI3_HOME)",
  "bwa (for BWA mode)",
  "STAR (for STAR mode)",
  "samtools"
]

alignment = [
  "bwa",
  "STAR",
  "samtools"
]
